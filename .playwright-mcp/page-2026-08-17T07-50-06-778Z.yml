              - heading "Horizon Trials" [level=3] [ref=f3e147]
              - paragraph [ref=f3e148]: A groundbreaking platform that uses AI to match cancer patients with clinical trials across Canada. Patients upload their medical records, and the system ranks trials by matching score, notifying them of newly listed opportunities.
              - generic [ref=f3e149]:
                - generic [ref=f3e150]:
                  - text: Challenge
                  - paragraph [ref=f3e151]: Cancer patients struggle to find relevant clinical trials. The process is manual, time-consuming, and often patients miss out on life-saving opportunities.
                - generic [ref=f3e152]:
                  - text: Solution
                  - paragraph [ref=f3e153]: We built an AI-powered matching engine using Google Gemini that analyzes patient records and trial requirements, delivering personalized matches with confidence scores.
