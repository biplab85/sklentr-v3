            - region [ref=f26e1486]:
              - paragraph [ref=f26e1488]: Ruthless scope and a proven stack. We build one sharp value loop first — the core feature, done well — and defer everything non-essential. A fixed scope agreed up front plus daily, visible progress keeps it on time.
          - generic [ref=f26e1489]:
            - heading [level=3] [ref=f26e1490]:
              - button "What does “Canadian management, global talent” mean for me?" [ref=f26e1491] [cursor=pointer]
            - region [ref=f26e1496]:
              - paragraph [ref=f26e1498]: Toronto-based project leads own strategy, communication, and accountability, while an expert global team handles engineering and design. You get premium quality and clear communication — without the premium markup.
          - generic [ref=f26e1499]:
            - heading [level=3] [ref=f26e1500]:
              - button "Do I own the source code?" [ref=f26e1501] [cursor=pointer]
            - region [ref=f26e1506]:
              - paragraph [ref=f26e1508]: Yes — 100%. You receive full source-code ownership and IP rights on delivery. No lock-in and no licensing games.
          - generic [ref=f26e1509]:
            - heading [level=3] [ref=f26e1510]:
              - button "What’s included in each pricing tier — are there hidden costs?" [ref=f26e1511] [cursor=pointer]
            - region [ref=f26e1516]:
              - paragraph [ref=f26e1518]: Pricing is fixed and published. Each tier lists exactly what’s included, and you approve the scope before we start. No surprise invoices, ever.
          - generic [ref=f26e1519]:
            - heading [level=3] [ref=f26e1520]:
              - button "Can you help with a Canada Startup Visa application?" [ref=f26e1521] [cursor=pointer]
            - region [ref=f26e1526]:
              - paragraph [ref=f26e1528]: Absolutely — it’s our specialty. We build working MVPs that prove business viability to designated organizations, on a timeline that fits your visa process.
          - generic [ref=f26e1529]:
            - heading [level=3] [ref=f26e1530]:
              - button "What happens after launch?" [ref=f26e1531] [cursor=pointer]
            - region [ref=f26e1536]:
              - paragraph [ref=f26e1538]: Every project includes a post-launch support window (2 weeks to 3 months, depending on tier). We’re a partner, not a vendor — many clients stay on for the next build.
          - generic [ref=f26e1539]:
            - heading [level=3] [ref=f26e1540]:
