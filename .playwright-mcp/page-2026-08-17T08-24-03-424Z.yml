            - heading [level=3] [ref=f15e1480]:
              - button "How can you deliver an MVP in 2–4 weeks?" [ref=f15e1481] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1488]: Ruthless scope and a proven stack. We build one sharp value loop first — the core feature, done well — and defer everything non-essential. A fixed scope agreed up front plus daily, visible progress keeps it on time.
          - generic [ref=f15e1489]:
            - heading [level=3] [ref=f15e1490]:
              - button "What does “Canadian management, global talent” mean for me?" [ref=f15e1491] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1498]: Toronto-based project leads own strategy, communication, and accountability, while an expert global team handles engineering and design. You get premium quality and clear communication — without the premium markup.
          - generic [ref=f15e1499]:
            - heading [level=3] [ref=f15e1500]:
              - button "Do I own the source code?" [ref=f15e1501] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1508]: Yes — 100%. You receive full source-code ownership and IP rights on delivery. No lock-in and no licensing games.
          - generic [ref=f15e1509]:
            - heading [level=3] [ref=f15e1510]:
              - button "What’s included in each pricing tier — are there hidden costs?" [ref=f15e1511] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1518]: Pricing is fixed and published. Each tier lists exactly what’s included, and you approve the scope before we start. No surprise invoices, ever.
          - generic [ref=f15e1519]:
            - heading [level=3] [ref=f15e1520]:
              - button "Can you help with a Canada Startup Visa application?" [ref=f15e1521] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1528]: Absolutely — it’s our specialty. We build working MVPs that prove business viability to designated organizations, on a timeline that fits your visa process.
          - generic [ref=f15e1529]:
            - heading [level=3] [ref=f15e1530]:
              - button "What happens after launch?" [ref=f15e1531] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1538]: Every project includes a post-launch support window (2 weeks to 3 months, depending on tier). We’re a partner, not a vendor — many clients stay on for the next build.
          - generic [ref=f15e1539]:
            - heading [level=3] [ref=f15e1540]:
              - button "Which technologies do you use?" [ref=f15e1541] [cursor=pointer]
            - region:
              - paragraph [ref=f15e1548]: A modern, consistent stack — Next.js, React, Laravel, React Native, Flutter, PostgreSQL, WordPress — with AI (Gemini, OpenAI, Claude) woven into product workflows where it adds real value.
