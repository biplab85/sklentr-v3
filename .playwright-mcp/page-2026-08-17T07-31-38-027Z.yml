            - heading [level=3] [ref=f2e1509]:
              - button "How can you deliver an MVP in 2–4 weeks?" [ref=f2e1510] [cursor=pointer]
            - region [ref=f2e1515]:
              - paragraph [ref=f2e1517]: Ruthless scope and a proven stack. We build one sharp value loop first — the core feature, done well — and defer everything non-essential. A fixed scope agreed up front plus daily, visible progress keeps it on time.
          - generic [ref=f2e1518]:
            - heading [level=3] [ref=f2e1519]:
              - button "What does “Canadian management, global talent” mean for me?" [ref=f2e1520] [cursor=pointer]
            - region [ref=f2e1525]:
              - paragraph [ref=f2e1527]: Toronto-based project leads own strategy, communication, and accountability, while an expert global team handles engineering and design. You get premium quality and clear communication — without the premium markup.
          - generic [ref=f2e1528]:
            - heading [level=3] [ref=f2e1529]:
              - button "Do I own the source code?" [ref=f2e1530] [cursor=pointer]
            - region [ref=f2e1535]:
              - paragraph [ref=f2e1537]: Yes — 100%. You receive full source-code ownership and IP rights on delivery. No lock-in and no licensing games.
          - generic [ref=f2e1538]:
            - heading [level=3] [ref=f2e1539]:
              - button "What’s included in each pricing tier — are there hidden costs?" [ref=f2e1540] [cursor=pointer]
            - region [ref=f2e1545]:
              - paragraph [ref=f2e1547]: Pricing is fixed and published. Each tier lists exactly what’s included, and you approve the scope before we start. No surprise invoices, ever.
          - generic [ref=f2e1548]:
            - heading [level=3] [ref=f2e1549]:
              - button "Can you help with a Canada Startup Visa application?" [ref=f2e1550] [cursor=pointer]
            - region [ref=f2e1555]:
              - paragraph [ref=f2e1557]: Absolutely — it’s our specialty. We build working MVPs that prove business viability to designated organizations, on a timeline that fits your visa process.
          - generic [ref=f2e1558]:
            - heading [level=3] [ref=f2e1559]:
              - button "What happens after launch?" [ref=f2e1560] [cursor=pointer]
            - region [ref=f2e1565]:
              - paragraph [ref=f2e1567]: Every project includes a post-launch support window (2 weeks to 3 months, depending on tier). We’re a partner, not a vendor — many clients stay on for the next build.
          - generic [ref=f2e1568]:
            - heading [level=3] [ref=f2e1569]:
              - button "Which technologies do you use?" [ref=f2e1570] [cursor=pointer]
            - region [ref=f2e1575]:
              - paragraph [ref=f2e1577]: A modern, consistent stack — Next.js, React, Laravel, React Native, Flutter, PostgreSQL, WordPress — with AI (Gemini, OpenAI, Claude) woven into product workflows where it adds real value.
