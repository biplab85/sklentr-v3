            - region [ref=f2e1501]:
              - paragraph [ref=f2e1503]: Toronto-based project leads own strategy, communication, and accountability, while an expert global team handles engineering and design. You get premium quality and clear communication — without the premium markup.
          - generic [ref=f2e1504]:
            - heading [level=3] [ref=f2e1505]:
              - button "Do I own the source code?" [ref=f2e1506] [cursor=pointer]
            - region [ref=f2e1511]:
              - paragraph [ref=f2e1513]: Yes — 100%. You receive full source-code ownership and IP rights on delivery. No lock-in and no licensing games.
          - generic [ref=f2e1514]:
