            - region [ref=f2e1491]:
              - paragraph [ref=f2e1493]: Ruthless scope and a proven stack. We build one sharp value loop first — the core feature, done well — and defer everything non-essential. A fixed scope agreed up front plus daily, visible progress keeps it on time.
          - generic [ref=f2e1494]:
            - heading [level=3] [ref=f2e1495]:
