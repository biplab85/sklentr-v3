            - region [ref=f4e1500]:
              - paragraph [ref=f4e1502]: Ruthless scope and a proven stack. We build one sharp value loop first — the core feature, done well — and defer everything non-essential. A fixed scope agreed up front plus daily, visible progress keeps it on time.
          - generic [ref=f4e1503]:
            - heading [level=3] [ref=f4e1504]:
              - button "What does “Canadian management, global talent” mean for me?" [ref=f4e1505] [cursor=pointer]
            - region [ref=f4e1510]:
              - paragraph [ref=f4e1512]: Toronto-based project leads own strategy, communication, and accountability, while an expert global team handles engineering and design. You get premium quality and clear communication — without the premium markup.
          - generic [ref=f4e1513]:
            - heading [level=3] [ref=f4e1514]:
              - button "Do I own the source code?" [ref=f4e1515] [cursor=pointer]
            - region [ref=f4e1520]:
              - paragraph [ref=f4e1522]: Yes — 100%. You receive full source-code ownership and IP rights on delivery. No lock-in and no licensing games.
          - generic [ref=f4e1523]:
            - heading [level=3] [ref=f4e1524]:
              - button "What’s included in each pricing tier — are there hidden costs?" [ref=f4e1525] [cursor=pointer]
            - region [ref=f4e1530]:
              - paragraph [ref=f4e1532]: Pricing is fixed and published. Each tier lists exactly what’s included, and you approve the scope before we start. No surprise invoices, ever.
          - generic [ref=f4e1533]:
            - heading [level=3] [ref=f4e1534]:
              - button "Can you help with a Canada Startup Visa application?" [ref=f4e1535] [cursor=pointer]
            - region [ref=f4e1540]:
              - paragraph [ref=f4e1542]: Absolutely — it’s our specialty. We build working MVPs that prove business viability to designated organizations, on a timeline that fits your visa process.
          - generic [ref=f4e1543]:
            - heading [level=3] [ref=f4e1544]:
              - button "What happens after launch?" [ref=f4e1545] [cursor=pointer]
            - region [ref=f4e1550]:
              - paragraph [ref=f4e1552]: Every project includes a post-launch support window (2 weeks to 3 months, depending on tier). We’re a partner, not a vendor — many clients stay on for the next build.
          - generic [ref=f4e1553]:
